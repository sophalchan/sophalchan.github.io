method: lora
description: "Parameter-efficient fine-tuning with Low-Rank Adaptation (PEFT LoRA)"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["c_attn", "c_proj"]  # distilgpt2; auto-detected for other architectures
training:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 50

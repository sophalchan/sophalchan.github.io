method: contextual_retrieval
description: "Contextual RAG — document title, category, summary prepended to each chunk embedding"
chunking:
  strategy: contextual_retrieval
  base_strategy: sentence_window
  max_sentences: 2
  sentence_overlap: 1
  context_template: "Document: {title} | Category: {category}\nSummary: {summary}\nPassage:\n"
vector_db:
  collection: rag_contextual

<script>
(function () {
  function filterByCategory(categoryName) {
    var root = document.getElementById("listing-portfolio-listing");
    if (!root) return;

    var buttons = document.querySelectorAll(
      "#listing-portfolio-listing .listing-category, .quarto-listing-category .listing-category"
    );

    for (var i = 0; i < buttons.length; i++) {
      var label = buttons[i].textContent.replace(/\s+/g, " ").trim();
      if (label === categoryName) {
        buttons[i].click();
        var target = document.getElementById("featured-projects");
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        return;
      }
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("[data-filter-category]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.preventDefault();
        filterByCategory(el.getAttribute("data-filter-category"));
      });
    });
  });
})();
</script>
